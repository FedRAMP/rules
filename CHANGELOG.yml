fedramp-consolidated-rules:
  - version: "2026.12.03.01"
    last_updated: "2026-12-03"
    release: true
    rules:
      - "FRD-MAS (Minimum Assessment Scope): Added to support the explanation in the rule. [#41](https://github.com/FedRAMP/rules/issues/41) (flagged by @ExtremoPenguin in [2026/145](https://github.com/FedRAMP/2026/discussions/145#discussioncomment-18903555))."
      - "FRC-CLA-MFR (Mandatory FedRAMP Rules for Class A): Added SDR-CSX-KSI to list of requirements because folks need a rule that explains how to document the key security indicators! [#45](https://github.com/FedRAMP/rules/issues/45) (flagged by @tnnrjmsn-eit in [2026/131](https://github.com/FedRAMP/2026/discussions/131#discussioncomment-19227470))."
      - "FRC-CLA-RFR (Recommended FedRAMP Rules for Class A): CPO-CSF-CPM (Certification Package Maintenance for Rev5) was removed. [#44](https://github.com/FedRAMP/rules/issues/44) (flagged by @tnnrjmsn-eit in [2026/158](https://github.com/FedRAMP/2026/discussions/158#discussioncomment-19205083))."
      - "FRC-CCL-DCC (Downgrading Certification Class): Fixed a typo in the note to clarify that downgrade should not happen WITHOUT providing advance notification. [#50](https://github.com/FedRAMP/rules/issues/50) (flagged by @StevenCh99 in [2026/158](https://github.com/FedRAMP/2026/discussions/158#discussioncomment-19355033))."
      - "FRC-CCL-UCC (Upgrading Certification Class): Updated wording and added a note to more explicitly clarify that upgrading is obtaining a new FedRAMP Certification. [#46](https://github.com/FedRAMP/rules/issues/46) (flagged by @tnnrjmsn-eit in [2026/118](https://github.com/FedRAMP/2026/discussions/118#discussioncomment-19229413))."
      - "IEC-CSO-IIR (Initial Incident Report): Marked the Trust Center or USDA Connect update to All Necessary Parties as optional in notification metadata in [#47](https://github.com/FedRAMP/rules/issues/47) (flagged by @zeesharfcspab [community/146](https://github.com/FedRAMP/community/discussions/146#discussioncomment-19247352) - the `updated` array was not updated for this change)."
      - "IEC-CSO-OIR (Ongoing Incident Reports): Marked the Trust Center or USDA Connect update to All Necessary Parties as optional in notification metadata. [#47](https://github.com/FedRAMP/rules/issues/47) (flagged by @zeesharfcspab [community/146](https://github.com/FedRAMP/community/discussions/146#discussioncomment-19247352) - the `updated` array was not updated for this change)."
      - "IEC-CSO-FIR (Final Incident Report): Marked the Trust Center or USDA Connect update to All Necessary Parties as optional in notification metadata. [#47](https://github.com/FedRAMP/rules/issues/47) (flagged by @zeesharfcspab [community/146](https://github.com/FedRAMP/community/discussions/146#discussioncomment-19247352) - the `updated` array was not updated for this change)."
      - "MKT-CSO-PML (Provider Marketplace Listing Requests): Corrected the name of the form. [#48](https://github.com/FedRAMP/rules/issues/48) (flagged by @tnnrjmsn-eit in [2026/160](https://github.com/FedRAMP/2026/discussions/160#discussioncomment-19280281))."
      - "KSI-SCR-MIT (Mitigating Supply Chain Risk): Changed wording order without any material impact to align with KSI standard language. Was: Persistently identify, review, and mitigate potential supply chain risks. [#42](https://github.com/FedRAMP/rules/issues/42)."
      - "FRC-CLA (20x Class A-Specific Provider Responsibilities): Removed FRC-CLA-MFR, FRC-CLA-RFR, FRC-CLA-OFR, and FRC-CLA-IVV. The applicable subsets and individual rules now identify Class A responsibilities. [#59](https://github.com/FedRAMP/rules/issues/59)."
      - "FRC-CLA-KSI (Class A Key Security Indicators): Replaced the list of seven named indicators. Applicants MUST address KSI-CMT-LMC (Logging Changes), KSI-CNA-RNT (Restricting Network Traffic), KSI-SVC-SIN (Securing Information), and any five of the 43 optional indicators in their Security Decision Record. [#59](https://github.com/FedRAMP/rules/issues/59)."
      - "Class A applicability now includes the AFC-CSO, AFC-FRP, CDS-CSO, CDS-UTC, FRC-CSX, IEC-CSO, IEC-FRP, SDR-CSO, SDR-CSX, VDR-CSO, and VDR-TFR subsets. CCM-OCR-AVL, CCM-OCR-LSI, CCM-OCR-NRD, CCM-OCR-RPS, CMU-CSO-UVM, IVV-CSX-AIA, and MAS-CSO-IIR explicitly include Class A. VDR-TFR-MVF excludes it. [#59](https://github.com/FedRAMP/rules/issues/59)."
      - "FRC-CCL (Changing Certification Class): Extended applicability to Classes A–D, both 20x and Rev5, and both the Program and Agency certification paths."
      - "CDS-CSO-PUB (Public Information): The Class A list omits the current FedRAMP Recognized independent assessment service and the link to Secure Configuration Guidance. [#59](https://github.com/FedRAMP/rules/issues/59)."
      - "CDS-CSO-HAD (Historical FedRAMP Certification Data) and CDS-CSO-UTC (Use Trust Centers): Class A providers MAY supply historical snapshots and MAY use a FedRAMP-compatible trust center. They still need a trust center. The historical data note clarifies that providers need only maintain snapshots dating back to their first Ongoing Certification Report. [#59](https://github.com/FedRAMP/rules/issues/59)."
      - "FRC-APP-FIA (Fresh Independent Assessment) and IVV-CSX-AIA (Annual Independent Assessments for 20x): A fresh initial FedRAMP independent assessment is optional for Class A. For ongoing assessment, 20x Class A providers MUST meet the expectations of their underlying alternative security framework. A separate FedRAMP independent assessment is unnecessary. [#59](https://github.com/FedRAMP/rules/issues/59)."
      - "SDR-CSO-FRR (FedRAMP Rules): Providers explain how they implement each rule or give the reason for nonimplementation and the resulting risk to customers. Partial implementations require both explanations. The Class A variant calls for a link to supporting external-framework documentation when applicable. [#60](https://github.com/FedRAMP/rules/issues/60)."
      - "VDR-TFR-NMV (Non-Machine Verification and Validation): Class A providers SHOULD verify and validate non-machine-based information resources at least every three months. VDR-TFR-MVX (Persistent Machine Verification and Validation for 20x) adds a Class D placeholder specifying verification at least every three days. [#59](https://github.com/FedRAMP/rules/issues/59)."
      - "CDS-TRC-NDA (No Required Agreements for FedRAMP) and CDS-TRC-NAA (No Required Agreements for Agencies): Trust centers MUST NOT require FedRAMP to accept an agreement on behalf of GSA to access certification data. They SHOULD NOT require agency representatives to accept an agreement on behalf of their agency for that access. [#56](https://github.com/FedRAMP/rules/issues/56)."
      - "AFC-CSO-EMR and AFC-CSO-TFG removed the mailbox configuration and automated validation artifacts. MAS-CSO-FLO, MAS-CSO-IIR, MAS-CSO-MDI, and MAS-CSO-TPR removed the artifact requesting code used to generate machine-readable output. [#61](https://github.com/FedRAMP/rules/issues/61) (flagged by @VSQ22022 in [2026/169](https://github.com/FedRAMP/2026/discussions/169#discussioncomment-19594410))."
      - "SCG-CSO-SDF, SCG-ENH-API, SCG-ENH-CMP, SCG-ENH-EXP, SCG-ENH-MRG, SCG-ENH-VRH, and VER-TFR-MRH now present access instructions or an explanation of unavailability as alternatives within a single artifact."
      - "VER-RPT-PER (Persistent Reporting): Clarified that providers MUST report vulnerability detection and response activity responsibly. IEC-CSO-EFR (Evaluate FedRAMP Reportability) capitalized MUST in the existing incident reporting obligation. [#52](https://github.com/FedRAMP/rules/issues/52)."
      - "FRD-IIR (Initial Incident Report), SCN-FRP-CAP (Corrective Action Plan Conditions), and SCN-CSO-EVA (Evaluate Changes): Corrected typographical errors. [#53](https://github.com/FedRAMP/rules/issues/53) (flagged by @kevinraymond in [community/192](https://github.com/FedRAMP/community/discussions/192)). Also corrected spelling in the SCN-TRF-TPR artifact."
      - "CTL (Rev5 controls): Expanded the control entries from 79 to 409. Each entry identifies whether the control is mandatory or optional for Classes B-D under FRC-CSF-BSL and whether IVV-CSF-AIA lists it for annual assessment."
      - "MKT-IIP (Provider Responsibilities for Initial Implementation Phase Listings): Explicitly includes Classes A-D for both 20x and Rev5 on the Program and Agency paths."
      - "FRC-CSO-PKG (FedRAMP Certification Package): Clarified that the entire SDR Ruleset is applicable, not just a specific top-level SDR rule. [#62](https://github.com/FedRAMP/rules/issues/62) (flagged by @badgerinspace in [community/146](https://github.com/FedRAMP/community/discussions/146#discussioncomment-19720497))."
      - "AFC-CSO-NOC (Notification of Changes): Added notification method to clarify that providers who use their public security email do not need to notify FedRAMP separately from updating CDS-CSO-PUB Public Information. [#63](https://github.com/FedRAMP/rules/issues/63) (flagged by @nicole-gov)."
    schema:
      - "Added optional `issue` URI fields to update-history entries and populated them for six changed definitions, requirements, and indicators."
      - "Added optional boolean `notification[].optional` fields."
      - "Extended the shared `class_key` and `class_name` enums with `g` and `G`."
      - "Clarified that the normative-force enum describes requirements."
      - "FRR requirements and KSI indicators now support top-level defaults with partial `varies_by_class` overrides. Each supplied field replaces the entire default value, including arrays and objects. Omitted fields inherit the default."
      - "FRR requirements now accept `varies_by_class.<class>.applicable`. True includes the class, false excludes it, and omission preserves the subset’s class applicability."
      - "FRR requirements now accept top-level `rev5_controls_list` and `pain_timeframes`. Class overrides can also supply `following_information_bullets`, `schema`, and minimum and maximum timeframe values."
      - "KSI indicators now require an effective statement and force for each class A–D. Indicators can supply common or class-specific supporting information, notes, artifacts, schema references, control lists, timeframes, and effective dates."
      - "Each CTL entry now requires `varies_by_class.<class>.force` (`MUST` or `MAY`) and a separate `assess_yearly_by_class.<class>` boolean for each class B–D."
      - "Added optional `notification[].note` text to FRR requirements so each notification method can explain when it applies."
    tooling:
      - "Added reference URL reachability checks to the full test runner and a `test:reference-urls` command, with redirects, HEAD-to-GET fallback, deduplication, timeouts, and tests using mocked responses."
      - "Extended ordering validation and fixes to configured arrays, including update histories across FRD, FRR, KSI, and CTL; added regression tests for stable sorting, source preservation, and repeat runs."
      - "Tightened TypeScript types to reflect the local schema, including metadata, class variants, notifications, artifacts, and CTL; removed legacy KSI array handling and added type-contract tests."
      - "Updated requirement checks to iterate over populated class variants and refreshed term-test fixtures for the stricter types."
      - "Removed `tools/export-spreadsheet.ts` and the spreadsheet export command."
      - "Revised maintenance documentation and branch-changelog instructions."
      - "Added `bun report profile <type> <class>` to list matching provider rules by primary force and `bun report overall` to count FRR rulesets, populated subsets, rules, KSI indicators, and CTL controls."
      - "Validation now resolves class overrides before checking statements, forces, and timeframe dependencies. FRR consistency checks also flag explicit class inclusions already covered by the subset. The test runner reports schema errors with their full JSON paths."
      - "Added Rev5 control checks against FRC-CSF-BSL and IVV-CSF-AIA, including control enhancements. Missing controls, missing source lists, and incorrect baseline forces or annual assessment flags fail the check. The test summary reports totals by class and the mismatch count."
      - "Changed reference URL failures to advisory warnings. The test suite skips the live check when the URL set was checked within the last hour. The standalone `test:reference-urls` command still checks immediately."
      - "Documented how to interpret a secondary force within a rule statement and its relationship to the primary `force` field. [#54](https://github.com/FedRAMP/rules/issues/54) (flagged by @kevinraymond in [community/193](https://github.com/FedRAMP/community/discussions/193#discussion-11243198))."
